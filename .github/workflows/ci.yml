name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app.py src scripts tests
      - run: python -m compileall -q app.py src scripts tests
      - run: pytest -q
      - run: python -c "from src.churn_app.scoring import load_artifacts; load_artifacts()"

  reproducible-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-notebook.txt
      - run: python scripts/train_model.py
      - run: jupyter nbconvert --execute --to notebook --output /tmp/churn-exploration-validated.ipynb exploratory_analysis.ipynb --ExecutePreprocessor.timeout=900
      - run: jupyter nbconvert --execute --to notebook --output /tmp/churn-model-validated.ipynb feature_engineering_and_modeling.ipynb --ExecutePreprocessor.timeout=900
